[workspace]
resolver = "3"
members = ["crates/exec", "crates/palestre","crates/pbc", "crates/vm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
pbc = { path = "crates/pbc" }
vm = { path = "crates/vm" }
exec = { path = "crates/exec" }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"